---
name: "HaVacation"
description: >-
  Makes your home look occupied while you're away by replaying historical
  Home Assistant entity activity with configurable random jitter.
version: "26.08.0"
slug: "havacation"
url: "https://github.com/davidnajar/HaVacation"
image: "ghcr.io/davidnajar/havacation"

arch:
  - amd64
  - aarch64

init: false
startup: application
boot: auto

# Gives the add-on a scoped Supervisor token and access to the HA Core API.
homeassistant_api: true

ingress: true
ingress_port: 8080
# Blazor Server uses a long-lived SignalR connection through ingress.
ingress_stream: true
panel_icon: "mdi:beach"

ports:
  8080/tcp: null
ports_description:
  8080/tcp: "HaVacation web UI (direct access, optional)"

# Runtime settings are managed by the HaVacation UI and persisted under /data.
options: {}
schema: {}

homeassistant: "2025.1.0"
