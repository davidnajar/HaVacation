services:
  havacation:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      HAVACATION_DATA_DIR: /data
      # Standalone Docker only. Home Assistant add-ons use Supervisor automatically.
      # HomeAssistant__Url: http://homeassistant.local:8123
      # HomeAssistant__Token: your_token_here
      # Vacation__Enabled: "true"
      # Vacation__TimeZone: Europe/Madrid
      # Vacation__Entities: light.living_room,cover.living_room_blind
